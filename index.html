<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">Quer namorar comigo?</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Imagem de fundo personalizada -->
  <div id="customBgImage" class="custom-bg-image"></div>
  
  <div class="container">
    <!-- Imagem/foto antes do título -->
    <div id="topImageContainer" class="top-image-container"></div>
    
    <h1 class="title" id="mainTitle">Quer namorar comigo?</h1>
    
    <!-- Subtítulo personalizado -->
    <p id="subtitle" class="subtitle"></p>
    
    <!-- Galeria de fotos -->
    <div id="photoGallery" class="photo-gallery"></div>
    
    <div class="buttons">
      <button id="yesBtn">Sim</button>
      <button id="noBtn">Não</button>
    </div>
  </div>

  <div id="overlay">
    <div class="hearts-container"></div>
    <div class="message-box">
      <button class="close-btn" id="closeBtn">✖</button>
      <h2>É você e eu</h2>
      <p>Nosso coração bate no mesmo ritmo agora 💖</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
